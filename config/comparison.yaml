# Parámetros de la comparación entre fuentes (Entrega 4).
comparison:
  input_csv: "docs/resultados/results.csv"          # salida de src/03_build_results.py
  fallback_csv: "docs/eda/por_municipio.csv"        # EDA de la Entrega 3 (sirve para empezar antes de tener results)
  out_dir: "docs/comparacion"
  top_n: 10                  # municipios en las tablas de mayores discrepancias
  ranking_n: 15              # municipios en el ranking por área apta
  concordance_top_k: 20      # tamaño del top usado para medir la concordancia entre rankings
  min_buildings_relative: 500  # mínimo de edificios (Microsoft) para listar una discrepancia relativa
